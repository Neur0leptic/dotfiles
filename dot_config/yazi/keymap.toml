[[mgr.prepend_keymap]]
on = "M"
run = "plugin mount"
desc = "Mount manager"

[[manager.prepend_keymap]]
on   = "<C-s>"
run  = 'shell "$SHELL" --block --confirm'
desc = "Open shell here"

[[manager.prepend_keymap]]
on  = "y"
run = [ '''
	shell 'for path in "$@"; do echo "file://$path"; done | wl-copy -t text/uri-list' --confirm
''', "yank" ]

[[manager.prepend_keymap]]
on = "t"
run = ["tab_create --current"]


[[mgr.prepend_keymap]]
on = ["c", "m"]
run = "plugin chmod"
desc = "Change permissions"

[[manager.prepend_keymap]]
on   = "T"
run  = "plugin toggle-pane max-preview"
desc = "Maximize or restore preview"

[[mgr.prepend_keymap]]
on = "C"
run = "plugin ouch --args=zip"
desc = "Compress with ouch"

[[mgr.prepend_keymap]]
on = "<A-d>"
run = '''shell -- ripdrag --no-click --and-exit --icon-size 64 --target --all "$@" | while read filepath; do cp -nR "$filepath" .; done '''
desc = "Drag files OUT (no overwrite)"

[[mgr.prepend_keymap]]
on = "<A-D>"
run = '''shell -- ripdrag --no-click --and-exit --icon-size 64 --target --all "$@" | while read filepath; do cp -fR "$filepath" .; done '''
desc = "Drag files OUT (overwrite)"

[[mgr.prepend_keymap]]
on = [ "g", "d" ]
run = "cd ~/Downloads"

[[mgr.prepend_keymap]]
on = [ "g", "t" ]
run = "cd /tmp"

[[mgr.prepend_keymap]]
on = [ "g", "b" ]
run = "cd ~/.local/bin/"

[[mgr.prepend_keymap]]
on = [ "g", "l" ]
run = "cd ~/.local/"

[[mgr.prepend_keymap]]
on = [ "g", "s" ]
run = "cd ~/screenshot/"

[[mgr.prepend_keymap]]
on = [ "g", "<Space>" ]
run = "cd --interactive"

[[mgr.prepend_keymap]]
on = [ "g", "v" ]
run = "cd ~/vimwiki"

[[mgr.prepend_keymap]]
on = [ "g", "G" ]
run = "cd ~/Games"

[[mgr.prepend_keymap]]
on = [ "g", "a" ]
run = "cd ~/.local/share/applications"

[[mgr.prepend_keymap]]
on = [ "g", "i" ]
run = "cd ~/.local/share/icons/candy-icons"

[[mgr.prepend_keymap]]
on = [ "g", "/" ]
run = "cd /"
desc = "Go to root"

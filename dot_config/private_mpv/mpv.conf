sub-font=Roboto Flex
sub-scale=0.7
ytdl-format=bestvideo[dynamic_range!=SDR]+bestaudio/bestvideo+bestaudio/best
vo=gpu-next
ao=pipewire
fullscreen=yes
slang=tr,eng,de
# mpv 0.42 keeps the window open after playback when started from its desktop file
# (the pseudo-gui profile now sets idle=yes). Close at the end as before.
idle=once
include=~~/gpu.conf

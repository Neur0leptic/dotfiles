
general {
    grace = 0
    no_fade_in = false
    disable_loading_bar = false
}

background {
    color = rgba(0, 0, 0, 1.0)
}

label {
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(248, 248, 248, 1.0)
    font_size = 90
    font_family = monospace

    position = 0, 80
    halign = center
    valign = center
}

label {
    text = cmd[update:60000] date +'%d %B %Y, %A'
    color = rgba(190, 169, 254, 0.9)
    font_size = 20
    font_family = monospace

    position = 0, -10
    halign = center
    valign = center
}

input-field {
    size = 250, 50
    outline_thickness = 2

    outer_color = rgba(129, 190, 253, 0.8)
    inner_color = rgba(0, 0, 0, 0.8)
    font_color = rgba(248, 248, 248, 1.0)

    check_color = rgba(53, 249, 169, 1.0)
    fail_color = rgba(253, 153, 145, 1.0)

    dots_size = 0.3
    dots_spacing = 0.2
    dots_center = true

    fade_on_empty = false
    placeholder_text =

    position = 0, -80
    halign = center
    valign = center
}

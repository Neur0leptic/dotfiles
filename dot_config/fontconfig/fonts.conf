<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Intentionally limit discovery to the portable tree and standard system roots. -->
  <reset-dirs />
  <dir prefix="xdg">fonts/portable</dir>
  <dir>/usr/local/share/fonts</dir>
  <dir>/usr/share/fonts</dir>

  <match target="scan">
    <test name="file" compare="contains">
      <string>/usr/local/share/fonts/</string>
    </test>
    <edit name="order" mode="assign">
      <int>50</int>
    </edit>
  </match>

  <match target="scan">
    <test name="file" compare="contains">
      <string>/usr/share/fonts/</string>
    </test>
    <edit name="order" mode="assign">
      <int>100</int>
    </edit>
  </match>

  <match target="scan">
    <test name="file" compare="contains">
      <string>/fonts/portable/nerd-fonts/</string>
    </test>
    <edit name="order" mode="assign">
      <int>30</int>
    </edit>
  </match>

  <match target="scan">
    <test name="file" compare="contains">
      <string>/fonts/portable/font-awesome/</string>
    </test>
    <edit name="order" mode="assign">
      <int>30</int>
    </edit>
  </match>

  <match target="scan">
    <test name="file" compare="contains">
      <string>/fonts/portable/times-new-roman/</string>
    </test>
    <edit name="order" mode="assign">
      <int>30</int>
    </edit>
  </match>

  <match target="scan">
    <test name="file" compare="contains">
      <string>/fonts/portable/eb-garamond/</string>
    </test>
    <edit name="order" mode="assign">
      <int>20</int>
    </edit>
  </match>

  <match target="scan">
    <test name="file" compare="contains">
      <string>/fonts/portable/liberation/</string>
    </test>
    <edit name="order" mode="assign">
      <int>20</int>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" compare="eq" qual="first">
      <string>sans-serif</string>
    </test>
    <test name="lang" compare="contains">
      <string>ja</string>
    </test>
    <edit name="family" mode="assign_replace">
      <string>Noto Sans CJK JP</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" compare="eq" qual="first">
      <string>serif</string>
    </test>
    <test name="lang" compare="contains">
      <string>ja</string>
    </test>
    <edit name="family" mode="assign_replace">
      <string>Noto Serif CJK JP</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" compare="eq" qual="first">
      <string>monospace</string>
    </test>
    <test name="lang" compare="contains">
      <string>ja</string>
    </test>
    <edit name="family" mode="assign_replace">
      <string>Noto Sans Mono CJK JP</string>
    </edit>
    <edit name="family" mode="append"><string>Symbols Nerd Font Mono</string></edit>
    <edit name="family" mode="append"><string>Noto Color Emoji</string></edit>
  </match>

  <match target="pattern">
    <test name="family" compare="eq" qual="first">
      <string>sans-serif</string>
    </test>
    <test name="lang" compare="contains">
      <string>ko</string>
    </test>
    <edit name="family" mode="assign_replace">
      <string>Noto Sans CJK KR</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" compare="eq" qual="first">
      <string>serif</string>
    </test>
    <test name="lang" compare="contains">
      <string>ko</string>
    </test>
    <edit name="family" mode="assign_replace">
      <string>Noto Serif CJK KR</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" compare="eq" qual="first">
      <string>monospace</string>
    </test>
    <test name="lang" compare="contains">
      <string>ko</string>
    </test>
    <edit name="family" mode="assign_replace">
      <string>Noto Sans Mono CJK KR</string>
    </edit>
    <edit name="family" mode="append"><string>Symbols Nerd Font Mono</string></edit>
    <edit name="family" mode="append"><string>Noto Color Emoji</string></edit>
  </match>

  <match target="pattern">
    <test name="family" compare="eq" qual="first">
      <string>sans-serif</string>
    </test>
    <test name="lang" compare="contains">
      <string>zh-cn</string>
    </test>
    <edit name="family" mode="assign_replace">
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" compare="eq" qual="first">
      <string>serif</string>
    </test>
    <test name="lang" compare="contains">
      <string>zh-cn</string>
    </test>
    <edit name="family" mode="assign_replace">
      <string>Noto Serif CJK SC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" compare="eq" qual="first">
      <string>monospace</string>
    </test>
    <test name="lang" compare="contains">
      <string>zh-cn</string>
    </test>
    <edit name="family" mode="assign_replace">
      <string>Noto Sans Mono CJK SC</string>
    </edit>
    <edit name="family" mode="append"><string>Symbols Nerd Font Mono</string></edit>
    <edit name="family" mode="append"><string>Noto Color Emoji</string></edit>
  </match>

  <match target="pattern">
    <test name="family" compare="eq" qual="first">
      <string>sans-serif</string>
    </test>
    <test name="lang" compare="contains">
      <string>zh-tw</string>
    </test>
    <edit name="family" mode="assign_replace">
      <string>Noto Sans CJK TC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" compare="eq" qual="first">
      <string>serif</string>
    </test>
    <test name="lang" compare="contains">
      <string>zh-tw</string>
    </test>
    <edit name="family" mode="assign_replace">
      <string>Noto Serif CJK TC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" compare="eq" qual="first">
      <string>monospace</string>
    </test>
    <test name="lang" compare="contains">
      <string>zh-tw</string>
    </test>
    <edit name="family" mode="assign_replace">
      <string>Noto Sans Mono CJK TC</string>
    </edit>
    <edit name="family" mode="append"><string>Symbols Nerd Font Mono</string></edit>
    <edit name="family" mode="append"><string>Noto Color Emoji</string></edit>
  </match>

  <match target="pattern">
    <test name="family" compare="eq" qual="first"><string>sans-serif</string></test>
    <edit name="family" mode="assign_replace"><string>Noto Sans</string></edit>
    <edit name="family" mode="append"><string>Noto Color Emoji</string></edit>
  </match>

  <match target="pattern">
    <test name="family" compare="eq" qual="first"><string>serif</string></test>
    <edit name="family" mode="assign_replace"><string>Noto Serif</string></edit>
    <edit name="family" mode="append"><string>Noto Color Emoji</string></edit>
  </match>

  <match target="pattern">
    <test name="family" compare="eq" qual="first"><string>monospace</string></test>
    <edit name="family" mode="assign_replace"><string>Noto Sans Mono</string></edit>
    <edit name="family" mode="append"><string>Symbols Nerd Font Mono</string></edit>
    <edit name="family" mode="append"><string>Noto Color Emoji</string></edit>
  </match>

  <match target="pattern">
    <test name="family" compare="eq" qual="first"><string>emoji</string></test>
    <edit name="family" mode="assign_replace"><string>Noto Color Emoji</string></edit>
  </match>

  <match target="pattern">
    <test name="family" compare="eq" qual="first"><string>system-ui</string></test>
    <edit name="family" mode="assign_replace" binding="strong"><string>Roboto Flex</string></edit>
    <edit name="family" mode="append"><string>Noto Sans</string></edit>
    <edit name="family" mode="append"><string>Noto Color Emoji</string></edit>
  </match>

  <match target="pattern">
    <test name="family" compare="eq" qual="first"><string>ui-sans-serif</string></test>
    <edit name="family" mode="assign_replace" binding="strong"><string>Roboto Flex</string></edit>
    <edit name="family" mode="append"><string>Noto Sans</string></edit>
    <edit name="family" mode="append"><string>Noto Color Emoji</string></edit>
  </match>

  <match target="pattern">
    <test name="family" compare="eq" qual="first"><string>ui-serif</string></test>
    <edit name="family" mode="assign_replace"><string>Noto Serif</string></edit>
    <edit name="family" mode="append"><string>Noto Color Emoji</string></edit>
  </match>

  <match target="pattern">
    <test name="family" compare="eq" qual="first"><string>ui-monospace</string></test>
    <edit name="family" mode="assign_replace"><string>Noto Sans Mono</string></edit>
    <edit name="family" mode="append"><string>Symbols Nerd Font Mono</string></edit>
    <edit name="family" mode="append"><string>Noto Color Emoji</string></edit>
  </match>

  <match target="font">
    <edit name="rgba" mode="assign">
      <const>none</const>
    </edit>
  </match>

  <match target="font">
    <edit name="hintstyle" mode="assign">
      <const>hintslight</const>
    </edit>
  </match>

  <match target="font">
    <edit name="autohint" mode="assign">
      <bool>false</bool>
    </edit>
  </match>
</fontconfig>
